[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "interrogate"
version = "0.1.0"
description = "Admission Filter for Recursion and Invariant Safety"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn>=0.27.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "httpx>=0.26.0",
    "ulid-py>=1.1.0",
    # Canonical receipt protocol. Hard dependency: this gate must not be able
    # to start without the validator.
    "legivellum",
]

[project.optional-dependencies]
dev = [
    "jsonschema>=4.21.1",  # canonical receipt schema conformance
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
    "pytest-httpx>=0.28.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.6.0",
    "mypy>=1.10.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/interrogate"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
files = ["src/interrogate"]
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true
check_untyped_defs = true
disallow_incomplete_defs = true
ignore_missing_imports = true
pretty = true

[tool.pytest.ini_options]
addopts = "-q --maxfail=1 --cov=interrogate --cov-report=term-missing --cov-fail-under=40"
testpaths = ["tests"]

# legivellum is the sibling protocol package, not published to an index.
[tool.uv.sources]
legivellum = { path = "../LegiVellum", editable = true }
