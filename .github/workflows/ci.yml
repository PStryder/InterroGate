name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout LegiVellum (canonical protocol package)
        uses: actions/checkout@v4
        with:
          repository: PStryder/LegiVellum
          path: _legivellum
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Canonical protocol package first. It is a hard dependency and is
          # not published to an index, so it comes from the sibling checkout.
          python -m pip install -e ./_legivellum
          python -m pip install -e ".[dev]"

      - name: Dependency health
        run: python -m pip check

      - name: Compile check
        run: python -m compileall -q src/interrogate

      - name: Ruff
        run: ruff check src tests

      - name: MyPy
        run: mypy src/interrogate

      - name: Validate MCP tool snapshot
        run: pytest tests/test_mcp_snapshot.py

      - name: Run tests
        run: pytest
